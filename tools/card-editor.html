<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡片 JSON 編輯器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --panel-light: #273449;
      --text: #f3f4f6;
      --muted: #a5b4c7;
      --accent: #60a5fa;
      --accent-strong: #2563eb;
      --danger: #fca5a5;
      --border: #3b4a61;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Noto Serif TC", serif;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 32px auto;
    }

    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    header p { margin: 0; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 16px;
      align-items: start;
    }

    .preview-panel { position: sticky; top: 16px; }

    [hidden] { display: none !important; }

    section {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    h2 { margin: 0 0 16px; font-size: 1.15rem; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 11px;
      background: var(--panel-light);
      color: var(--text);
      font: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    label.checkbox { display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
    label.checkbox input { width: auto; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 10px 15px;
      background: var(--accent-strong);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover { background: var(--accent); color: #10203b; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #64748b; color: white; }

    textarea {
      min-height: 330px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .skill-list { display: grid; gap: 10px; margin-bottom: 10px; }
    .skill-list:empty { display: none; }
    .skill-group-title { margin: 6px 0 -4px; color: var(--muted); font-size: 0.9rem; }

    details.skill {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }

    details.skill > summary {
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .skill-body { display: grid; gap: 10px; padding: 0 12px 12px; }
    .skill-body textarea { min-height: 60px; font-family: inherit; font-size: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .skill-body label, .effect label { font-size: 0.85rem; color: var(--muted); }
    .skill-body .field, .effect .field { margin-bottom: 0; }

    .effects { display: grid; gap: 8px; }

    .effect {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
    }

    .effect-header { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    button.small { padding: 4px 10px; font-size: 0.85rem; }
    button.add-effect { justify-self: start; }

    .message {
      min-height: 1.4em;
      margin-top: 12px;
      color: var(--muted);
    }

    .message.error { color: var(--danger); }
    .message.success { color: #86efac; }

    @media (max-width: 720px) {
      main { margin: 20px auto; }
      .layout { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .preview-panel { position: static; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>卡片 JSON 編輯器</h1>
      <p>輸入一張卡片的定義，預覽後下載成 JSON seed 檔案。</p>
    </header>

    <div class="layout">
      <section>
        <h2>卡片定義</h2>
        <form id="card-form" novalidate>
          <div class="field">
            <label for="card-id">卡片 ID</label>
            <input id="card-id" name="cardId" required maxlength="64" placeholder="card_001">
          </div>

          <div class="field">
            <label for="card-name">卡片名稱</label>
            <input id="card-name" name="cardName" required maxlength="100" placeholder="Test Card">
          </div>

          <div class="field">
            <label for="rarity">稀有度</label>
            <select id="rarity" name="rarity" required>
              <option value="R">R</option>
              <option value="SR">SR</option>
              <option value="SSR">SSR</option>
              <option value="UR">UR</option>
            </select>
          </div>

          <div class="field">
            <label for="race">種族</label>
            <select id="race" name="race" required>
              <option value="Human">人族 (Human)</option>
              <option value="Xian">仙族 (Xian)</option>
              <option value="Mo">魔族 (Mo)</option>
              <option value="Dragon">龍族 (Dragon)</option>
              <option value="Hybrid">雜種 (Hybrid)</option>
            </select>
          </div>

          <div class="field">
            <label>基本屬性</label>
            <div class="stats">
              <input id="attack" name="attack" type="number" min="0" step="1" required placeholder="攻擊力" aria-label="攻擊力">
              <input id="defense" name="defense" type="number" min="0" step="1" required placeholder="防禦力" aria-label="防禦力">
              <input id="health" name="health" type="number" min="0" step="1" required placeholder="生命值" aria-label="生命值">
              <input id="attack-ratio" name="attackRatio" type="number" min="0" step="any" required placeholder="攻擊成長率" aria-label="攻擊成長率">
              <input id="defense-ratio" name="defenseRatio" type="number" min="0" step="any" required placeholder="防禦成長率" aria-label="防禦成長率">
              <input id="health-ratio" name="healthRatio" type="number" min="0" step="any" required placeholder="生命成長率" aria-label="生命成長率">
            </div>
          </div>

          <div class="field">
            <label>技能</label>
            <div id="skills-fixed" class="skill-list"></div>
            <div id="skills-talent-wrap" hidden>
              <div class="skill-group-title">天賦技能（SSR 3 個、UR 4 個）</div>
              <div id="skills-talent" class="skill-list"></div>
            </div>
          </div>

          <div class="field">
            <label class="checkbox"><input id="is-enabled" name="isEnabled" type="checkbox" checked> 啟用</label>
          </div>

          <div class="actions">
            <button type="submit">預覽 JSON</button>
            <button type="button" class="secondary" id="clear-button">清除</button>
          </div>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="preview-panel">
        <h2>JSON 預覽</h2>
        <textarea id="json-preview" readonly spellcheck="false" aria-label="JSON 預覽"></textarea>
        <div class="actions">
          <button type="button" id="download-button">下載 JSON</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector("#card-form");
    const preview = document.querySelector("#json-preview");
    const message = document.querySelector("#message");
    const downloadButton = document.querySelector("#download-button");
    const clearButton = document.querySelector("#clear-button");

    // 選項需與 Server/model/constants 的 skill_*.go 保持一致。
    const ENUMS = {
      trigger: [["BattleStart", "戰鬥開始時"], ["BeforeRoundStart", "回合開始前"], ["RoundEnd", "回合結束時"], ["BeforeAction", "行動前"], ["AfterAction", "行動後"]],
      target: [["Single", "單體"], ["Opposite", "對位"], ["Random3", "隨機3人"], ["All", "全體"], ["FrontRow", "前排"], ["BackRow", "後排"], ["Column", "縱排"]],
      effectType: [["Damage", "傷害"], ["Status", "狀態"], ["Heal", "回血"], ["Buff", "增減屬性"], ["Rage", "增減怒氣"]],
      stat: [["Health", "生命"], ["Attack", "攻擊"], ["Defense", "防禦"]],
      status: [["Poison", "中毒"], ["Burn", "燃燒"], ["Stun", "暈眩"]],
      damageType: [["Physical", "物理"], ["Magic", "魔法"], ["True", "真實"]],
      side: [["Enemy", "敵方"], ["Ally", "我方"], ["Self", "自己"]]
    };
    const TALENT_COUNT = { SSR: 3, UR: 4 };
    // 第三欄表示是否需要觸發時機：普攻與主動由行動流程和怒氣（滿 100 施放）決定，不填。
    const FIXED_SKILLS = [["normalAtk", "普通攻擊", false], ["activeSkill", "主動技能", false], ["passiveSkill", "被動技能", true]];
    const DOT_STATUSES = ["Poison", "Burn"];
    // 效果欄位的顯示與輸出順序
    const EFFECT_FIELDS = [
      ["damageType", "傷害類型", "damageType"],
      ["stat", "屬性", "stat"],
      ["status", "狀態", "status"],
      ["scaleStat", "基準屬性（施放者）", "stat"],
      ["value", "數值（%）"],
      ["duration", "持續回合"],
      ["maxStack", "可疊加層數（選填）"]
    ];

    const skillsFixed = document.querySelector("#skills-fixed");
    const skillsTalent = document.querySelector("#skills-talent");
    const skillsTalentWrap = document.querySelector("#skills-talent-wrap");
    const raritySelect = document.querySelector("#rarity");
    let prevRarity = raritySelect.value;

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      node.append(...children);
      return node;
    }

    function makeSelect(enumKey, blankLabel) {
      const select = el("select");
      select.append(el("option", { value: "", textContent: blankLabel }));
      for (const [value, label] of ENUMS[enumKey]) {
        select.append(el("option", { value, textContent: `${label} (${value})` }));
      }
      return select;
    }

    function labeled(text, control) {
      return el("div", { className: "field" }, [el("label", { textContent: text }), control]);
    }

    function effectFieldsFor(type, status) {
      switch (type) {
        case "Damage": return ["damageType", "scaleStat", "value"];
        case "Heal": return ["scaleStat", "value"];
        case "Buff": return ["stat", "value", "duration", "maxStack"];
        case "Rage": return ["value"];
        case "Status":
          if (!status) return ["status"];
          return DOT_STATUSES.includes(status)
            ? ["status", "scaleStat", "value", "duration", "maxStack"]
            : ["status", "duration", "maxStack"];
        default: return [];
      }
    }

    function createEffect(effectsEl) {
      const refs = {
        type: makeSelect("effectType", "請選擇"),
        side: makeSelect("side", "請選擇"),
        target: makeSelect("target", "沿用技能目標")
      };
      const wrappers = {};
      const title = el("span");
      const removeButton = el("button", { type: "button", className: "secondary small", textContent: "刪除效果" });
      const node = el("div", { className: "effect" }, [
        el("div", { className: "effect-header" }, [title, removeButton]),
        el("div", { className: "grid-3" }, [
          labeled("效果類型", refs.type),
          labeled("作用陣營", refs.side),
          (wrappers.target = labeled("目標形狀", refs.target))
        ])
      ]);

      const fieldGrid = el("div", { className: "grid-3" });
      for (const [key, label, enumKey] of EFFECT_FIELDS) {
        refs[key] = enumKey ? makeSelect(enumKey, "請選擇") : el("input", { type: "number", step: "1" });
        wrappers[key] = labeled(label, refs[key]);
        fieldGrid.append(wrappers[key]);
      }
      node.append(fieldGrid);

      function refresh() {
        const visible = effectFieldsFor(refs.type.value, refs.status.value);
        for (const [key] of EFFECT_FIELDS) wrappers[key].hidden = !visible.includes(key);
        wrappers.target.hidden = refs.side.value === "Self";
        wrappers.value.querySelector("label").textContent =
          refs.type.value === "Rage" ? "怒氣點數（可為負）" : "數值（%）";
      }
      for (const key of ["type", "side", "status"]) refs[key].addEventListener("change", refresh);
      removeButton.addEventListener("click", () => {
        node.remove();
        renumberEffects(effectsEl);
      });

      node._refs = refs;
      node._title = title;
      refresh();
      return node;
    }

    function renumberEffects(effectsEl) {
      [...effectsEl.children].forEach((node, i) => { node._title.textContent = `效果 #${i + 1}`; });
    }

    function addEffect(effectsEl) {
      effectsEl.append(createEffect(effectsEl));
      renumberEffects(effectsEl);
    }

    function createSkill(title, talent, hasTrigger) {
      const refs = {
        name: el("input", { maxLength: 100, placeholder: "技能名稱" }),
        desc: el("textarea", { rows: 2, placeholder: "技能描述" }),
        trigger: makeSelect("trigger", "請選擇"),
        target: makeSelect("target", "（無）")
      };
      const wrappers = {};
      const effectsEl = el("div", { className: "effects" });
      const addButton = el("button", { type: "button", className: "secondary small add-effect", textContent: "新增效果" });
      addButton.addEventListener("click", () => addEffect(effectsEl));

      const body = el("div", { className: "skill-body" }, [
        el("div", { className: "grid-3" }, [
          labeled("名稱", refs.name),
          (wrappers.trigger = labeled("觸發時機", refs.trigger)),
          labeled("預設目標形狀", refs.target)
        ]),
        labeled("描述", refs.desc)
      ]);
      if (talent) {
        refs.star = el("input", { type: "number", min: "0", step: "1", placeholder: "星數" });
        refs.level = el("input", { type: "number", min: "0", step: "1", placeholder: "等級" });
        body.append(el("div", { className: "grid-2" }, [labeled("解鎖星數", refs.star), labeled("解鎖等級", refs.level)]));
      }
      body.append(effectsEl, addButton);

      const node = el("details", { className: "skill", open: true }, [el("summary", { textContent: title }), body]);
      wrappers.trigger.hidden = !hasTrigger;
      node._refs = refs;
      node._hasTrigger = hasTrigger;
      node._effectsEl = effectsEl;
      addEffect(effectsEl);
      return node;
    }

    function skillHasContent(node) {
      const r = node._refs;
      return Boolean(r.name.value || r.desc.value || r.star?.value || r.level?.value ||
        [...node._effectsEl.children].some((e) => e._refs.type.value));
    }

    // 依稀有度補齊或移除天賦區塊；使用者取消移除時回傳 false。
    function syncTalents() {
      const needed = TALENT_COUNT[raritySelect.value] || 0;
      const blocks = [...skillsTalent.children];
      if (blocks.length > needed) {
        const removed = blocks.slice(needed);
        if (removed.some(skillHasContent) && !confirm("切換稀有度會移除已填寫的天賦，確定嗎？")) return false;
        removed.forEach((node) => node.remove());
      }
      for (let i = skillsTalent.children.length; i < needed; i++) {
        skillsTalent.append(createSkill(`天賦 ${i + 1}`, true, true));
      }
      skillsTalentWrap.hidden = needed === 0;
      return true;
    }

    function resetSkills() {
      skillsFixed.replaceChildren(...FIXED_SKILLS.map(([, label, hasTrigger]) => createSkill(label, false, hasTrigger)));
      skillsTalent.replaceChildren();
      syncTalents();
    }

    function readInt(input, label, { min = 0, nonZero = false, allowNegative = false } = {}) {
      const text = input.value.trim();
      if (!/^-?\d+$/.test(text)) throw new Error(`${label} 必須是整數。`);
      const number = Number(text);
      if (!allowNegative && number < 0) throw new Error(`${label} 不可為負數。`);
      if (!allowNegative && number < min) throw new Error(`${label} 必須大於或等於 ${min}。`);
      if (nonZero && number === 0) throw new Error(`${label} 不可為 0。`);
      return number;
    }

    function readEffect(refs, skillTarget) {
      const type = refs.type.value;
      if (!type) throw new Error("請選擇效果類型。");
      const side = refs.side.value;
      if (!side) throw new Error("請選擇作用陣營。");

      const effect = { type, side };
      if (side !== "Self") {
        if (refs.target.value) effect.target = refs.target.value;
        else if (!skillTarget) throw new Error("請指定目標形狀（效果或技能的預設目標）。");
        if (side === "Ally" && (refs.target.value || skillTarget) === "Opposite") {
          throw new Error("對位只能用於敵方。");
        }
      }

      const visible = effectFieldsFor(type, refs.status.value);
      for (const [key, label, enumKey] of EFFECT_FIELDS) {
        if (!visible.includes(key)) continue;
        if (enumKey) {
          if (!refs[key].value) throw new Error(`請選擇${label}。`);
          effect[key] = refs[key].value;
        } else if (key === "value") {
          effect.value = type === "Buff" || type === "Rage"
            ? readInt(refs.value, label, { allowNegative: true, nonZero: true })
            : readInt(refs.value, label, { min: 1 });
        } else if (key === "duration") {
          effect.duration = readInt(refs.duration, label, { min: 1 });
        } else if (refs.maxStack.value.trim() !== "") {
          const maxStack = readInt(refs.maxStack, label);
          if (maxStack > 0) effect.maxStack = maxStack;
        }
      }
      return effect;
    }

    function readSkill(node, talent) {
      const r = node._refs;
      const name = r.name.value.trim();
      if (!name) throw new Error("名稱不可為空。");
      if (node._hasTrigger && !r.trigger.value) throw new Error("請選擇觸發時機。");

      const skill = { name, desc: r.desc.value.trim() };
      if (node._hasTrigger) skill.trigger = r.trigger.value;
      if (r.target.value) skill.target = r.target.value;
      if (talent) {
        const star = r.star.value.trim() === "" ? 0 : readInt(r.star, "解鎖星數");
        const level = r.level.value.trim() === "" ? 0 : readInt(r.level, "解鎖等級");
        if (star === 0 && level === 0) throw new Error("天賦必須設定解鎖星數或等級。");
        skill.unlock = {};
        if (star > 0) skill.unlock.star = star;
        if (level > 0) skill.unlock.level = level;
      }

      const effectNodes = [...node._effectsEl.children];
      if (effectNodes.length === 0) throw new Error("至少需要一個效果。");
      skill.effects = effectNodes.map((effectNode, i) => {
        try {
          return readEffect(effectNode._refs, skill.target);
        } catch (error) {
          throw new Error(`效果 #${i + 1}：${error.message}`);
        }
      });
      return skill;
    }

    function readSkillWithLabel(node, label, talent) {
      try {
        return readSkill(node, talent);
      } catch (error) {
        throw new Error(`${label}：${error.message}`);
      }
    }

    function buildSkillConfig() {
      const config = {};
      FIXED_SKILLS.forEach(([key, label], i) => {
        config[key] = readSkillWithLabel(skillsFixed.children[i], label, false);
      });
      const needed = TALENT_COUNT[raritySelect.value] || 0;
      if (skillsTalent.children.length !== needed) throw new Error(`${raritySelect.value} 需要 ${needed} 個天賦。`);
      config.talentSkill = [...skillsTalent.children].map((node, i) => readSkillWithLabel(node, `天賦 ${i + 1}`, true));
      return config;
    }

    raritySelect.addEventListener("change", () => {
      if (syncTalents()) prevRarity = raritySelect.value;
      else raritySelect.value = prevRarity;
    });
    resetSkills();

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = `message ${type}`.trim();
    }

    function getIntegerValue(id, label) {
      const value = document.querySelector(`#${id}`).value;
      if (!/^\d+$/.test(value)) {
        throw new Error(`${label} 必須是非負整數。`);
      }
      return Number(value);
    }

    function getRatioValue(id, label) {
      const value = document.querySelector(`#${id}`).value.trim();
      const number = Number(value);
      if (value === "" || !Number.isFinite(number) || number < 0) {
        throw new Error(`${label} 必須是非負數字。`);
      }
      return number;
    }

    function buildCard() {
      const cardId = document.querySelector("#card-id").value.trim();
      const cardName = document.querySelector("#card-name").value.trim();
      if (!cardId || !cardName) {
        throw new Error("卡片 ID 和卡片名稱不可為空。");
      }

      return {
        cardId,
        cardName,
        rarity: document.querySelector("#rarity").value,
        race: document.querySelector("#race").value,
        baseConfig: {
          attack: getIntegerValue("attack", "攻擊力"),
          attackRatio: getRatioValue("attack-ratio", "攻擊成長率"),
          defense: getIntegerValue("defense", "防禦力"),
          defenseRatio: getRatioValue("defense-ratio", "防禦成長率"),
          health: getIntegerValue("health", "生命值"),
          healthRatio: getRatioValue("health-ratio", "生命成長率")
        },
        skillConfig: buildSkillConfig(),
        isEnabled: document.querySelector("#is-enabled").checked
      };
    }

    function updatePreview() {
      try {
        const card = buildCard();
        preview.value = JSON.stringify(card, null, 2);
        setMessage("JSON 預覽已更新。", "success");
        return card;
      } catch (error) {
        setMessage(error.message, "error");
        return null;
      }
    }

    function safeFileName(name) {
      return name.replace(/[\\/:*?"<>|]/g, "_").trim() || "card";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      updatePreview();
    });

    downloadButton.addEventListener("click", () => {
      const card = updatePreview();
      if (!card) return;

      const blob = new Blob(
        [JSON.stringify(card, null, 2) + "\n"],
        { type: "application/json;charset=utf-8" }
      );
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${safeFileName(card.cardId)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setMessage(`已下載 ${link.download}`, "success");
    });

    clearButton.addEventListener("click", () => {
      form.reset();
      prevRarity = raritySelect.value;
      resetSkills();
      preview.value = "";
      setMessage("");
    });
  </script>
</body>
</html>
